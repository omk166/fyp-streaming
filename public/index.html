<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FYP Streaming Lab</title>
<style>
body{font:16px system-ui;background:#101827;color:#edf4ff;margin:0;padding:28px}main{max-width:1200px;margin:auto}h1{margin-bottom:6px}p{color:#b8c9df}button,input,select{font:inherit;padding:10px;border-radius:6px;border:1px solid #70849c;margin:4px}button{cursor:pointer;background:#b5f1dd;color:#101827}button:disabled{opacity:.4}#media{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:24px 0}video{width:100%;background:#000;border-radius:8px}pre{white-space:pre-wrap;max-height:220px;overflow:auto;background:#1d2a3d;padding:16px}.panel{padding:16px;background:#1d2a3d;border-radius:10px;margin:16px 0}label{display:inline-block}
</style></head><body><main><h1>FYP Streaming Lab</h1><p>Research prototype · WebRTC + mediasoup · original audio path</p>
<div class="panel"><label>Room <input id="room" value="lab" maxlength="48"></label><label>Video mode <select id="mode"><option value="h264">H.264 single</option><option value="simulcast">H.264 two layers</option><option value="vp9">VP9 SVC</option></select></label><label><input type="checkbox" id="synthetic">Synthetic test media</label><button id="join">Join room</button><button id="leave" disabled>Leave</button></div>
<div><button id="mic" disabled>Mute microphone</button><button id="camera" disabled>Pause camera</button><button id="export">Export raw telemetry</button></div>
<p id="status" role="status">Ready. Local research use; no recording of media.</p><div id="media"></div><h2>Live measurements</h2><pre id="metrics">Join to collect one-second samples.</pre>
<form id="chatForm"><label>Room message <input id="message" maxlength="1000"></label><button id="send" disabled>Send</button></form><pre id="chat" aria-live="polite"></pre><script type="module" src="/bundle.js"></script></main></body></html>
